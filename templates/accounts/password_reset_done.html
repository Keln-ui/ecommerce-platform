{% extends "base.html" %}

{% block title %}Password reset email sent · {{ SITE_NAME }}{% endblock %}

{% block content %}
<div style="max-width:430px;margin:2rem auto;text-align:center;">
  <div class="form-card">
    <h1 style="margin-top:0;">Check your email</h1>
    <p class="muted">We've sent a password-reset link to the email address you provided. It may take a few minutes to arrive.</p>

    <a href="{% url 'accounts:login' %}" class="btn btn-primary">Log in</a>
  </div>
</div>
{% endblock %}
