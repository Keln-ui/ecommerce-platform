{% extends "base.html" %}

{% block title %}Password changed · {{ SITE_NAME }}{% endblock %}

{% block content %}
<div style="max-width:430px;margin:2rem auto;text-align:center;">
  <div class="form-card">
    <h1 style="margin-top:0;">Password changed</h1>
    <p class="muted">Your password has been updated successfully. You can now log in with your new password.</p>

    <a href="{% url 'accounts:login' %}" class="btn btn-primary">Log in</a>
  </div>
</div>
{% endblock %}
